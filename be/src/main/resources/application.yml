spring:
  application:
    name: salone-auto

  # In locale i segreti stanno in be/.env (formato CHIAVE=valore, fuori dalla repo).
  # Su Render arrivano come variabili d'ambiente del servizio.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # In locale valgono i valori dopo i due punti. Su Render DatabaseUrl legge
    # DATABASE_URL e sovrascrive queste tre proprieta'.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salone_auto}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Gmail con password per le app. Nessun valore di ripiego: senza le due
  # variabili l'applicazione non parte, e la password non entra mai nella repo.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Se Gmail non risponde il thread dell'avviso non resta appeso
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Allo spegnimento (es. redeploy su Render) si aspetta che le mail in corso finiscano
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s

  data:
    web:
      pageable:
        # Un client non puo' chiedere tutto il catalogo in una volta
        max-page-size: 50

server:
  # Render assegna la porta in PORT.
  port: ${PORT:8080}
  shutdown: graceful
  # Dietro il proxy https di Render: Spring riconosce le richieste come sicure (HSTS compreso)
  forward-headers-strategy: framework

management:
  # L'health e' pubblico: senza questa riga ogni chiamata farebbe un login SMTP su Gmail,
  # e un abuso potrebbe far bloccare l'account che manda gli avvisi
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # In produzione: ALLOWED_ORIGIN=https://<fe>.onrender.com (piu' valori separati da virgola).
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173}
  jwt:
    # HS256: almeno 32 caratteri. Nessun default, senza JWT_SECRET l'app non parte.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  auth:
    # Tentativi di login/registrazione al minuto per IP, poi 429 (freno agli attacchi a dizionario)
    tentativi-al-minuto: ${AUTH_TENTATIVI_AL_MINUTO:10}
  admin:
    # L'amministratore viene creato al primo avvio con queste credenziali.
    email: ${ADMIN_EMAIL:admin@salone.it}
    password: ${ADMIN_PASSWORD}
  # Al primo avvio, con il catalogo vuoto, importa auto di esempio da Wikipedia e DummyJSON
  importa-auto-esempio: ${IMPORTA_AUTO_ESEMPIO:true}
  # Indirizzo del frontend, usato per il link "disattiva avviso" nella mail.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
